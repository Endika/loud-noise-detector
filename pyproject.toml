[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loud-noise-detector"
version = "3.0.0"
description = "Audio monitoring system that detects and alerts you about important sounds in your home while you're away."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Endika Iglesias", email = "endika2@gmail.com" }]
keywords = ["audio", "monitoring", "sound-detection", "pet-care", "baby-monitor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pyaudio>=0.2.14,<0.3",
    "pyyaml>=6.0.3,<7",
    "requests>=2.32.5,<3",
    "numpy>=2.1,<3",
    "python-dotenv>=1.2.1,<2",
]

[project.urls]
Homepage = "https://github.com/Endika/loud-noise-detector"
Repository = "https://github.com/Endika/loud-noise-detector"
Issues = "https://github.com/Endika/loud-noise-detector/issues"

[project.scripts]
loud-noise-detector = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<10.0.0",
    "pytest-cov>=6.3.0,<7",
    "pytest-benchmark>=5.2.3,<6",
    "ruff>=0.15.14,<0.17.0",
    "mypy>=1.19.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = ["**/test_*.py"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE"]
exclude = ["**/test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["SIM117"]

[tool.coverage.run]
omit = ["*/test_*.py", "*/__init__.py", "*/base.py"]
